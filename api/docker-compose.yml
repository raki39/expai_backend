# Fase 0A - servico `api`, desenvolvimento LOCAL.
#
# A Railway NAO usa este arquivo. Ela constroi um servico a partir do
# Dockerfile desta pasta, conforme railway.toml. Compose nao e orquestrado
# pela Railway.
#
#   docker compose up --build      sobe a api em http://localhost:8000
#   docker compose logs -f api     log JSON estruturado
#   docker compose down            para, PRESERVANDO o volume
#   docker compose down -v         para e APAGA o banco
#
# Requer .env preenchido nesta pasta (copie de .env.example).

services:
  api:
    build:
      # Mesmo contexto do build da Railway (Root Directory = /api). Se local e
      # producao construissem diferente, um dos dois deixaria de ser testado.
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      # Sobrepoe o .env: dentro do container os caminhos apontam para o volume.
      APP_ENV: local
      PORT: "8000"
      DB_PATH: /data/fase0a.sqlite3
      DATA_DIR: /data/datasets
    volumes:
      # Equivale ao volume da Railway montado em /data. E o que faz o banco
      # sobreviver a `docker compose down` e a rebuild da imagem.
      - dados_api:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  dados_api:
