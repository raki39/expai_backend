# Servico `api` da Fase 0A.
#
# Repositorio proprio: `backend/` (contem `api/`).
#
# ATENCAO: o arquivo de config da Railway NAO segue o root directory.
# Informe o caminho absoluto nas configuracoes do servico: /api/railway.toml
#
# Configurar no painel da Railway, para este servico:
#   Repositorio ......: backend
#   Root directory ...: /api
#   Watch paths ......: nao e necessario (repositorio dedicado)
#   Volume ...........: mount path /data
#   Dominio publico ..: NENHUM - a api so e alcancada pela rede privada
#
# Variaveis (ver api/.env.example):
#   APP_ENV=railway            torna API_SERVICE_TOKEN obrigatorio
#   DB_PATH=/data/fase0a.sqlite3        CAMINHO ABSOLUTO
#   DATA_DIR=/data/datasets             CAMINHO ABSOLUTO
#   API_SERVICE_TOKEN=...      o mesmo valor definido no servico `web`
#   ANTHROPIC_API_KEY=...  OPENAI_API_KEY=...
#   LLM_MAX_USD_ABSOLUTE=5.00  limite que a config do banco nao pode exceder
#
# Ver .docs/adr/0007-topologia-dois-servicos.md

[build]
builder = "RAILPACK"

[deploy]
# Bind em "::" e OBRIGATORIO. A rede privada da Railway resolve o DNS interno
# para IPv6 alem de IPv4 em ambientes criados apos out/2025; ligar apenas em
# 0.0.0.0 produz falha de conectividade que parece bug de aplicacao.
startCommand = "uvicorn app.main:app --host :: --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
