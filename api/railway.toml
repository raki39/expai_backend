# Servico `api` da Fase 0A - Railway.
#
# O repositorio `backend` abriga mais de um servico. O contexto de build e a
# RAIZ do repositorio, e cada servico e identificado pelo caminho do seu
# Dockerfile. Assim NAO e preciso configurar Root Directory.
#
# A Railway constroi UM servico por vez a partir do Dockerfile. Ela NAO
# orquestra docker-compose: o compose da raiz e so para desenvolvimento local.
#
# ===========================================================================
# CONFIGURACAO NO PAINEL DA RAILWAY
# ===========================================================================
#
#   Settings > Source > Root Directory ......... VAZIO (raiz do repositorio)
#   Settings > Build  > Builder ................ Dockerfile
#   Settings > Build  > Dockerfile Path ........ api/Dockerfile
#   Settings > Source > Watch Paths ............ /api/**
#
# Os tres ultimos ja vem deste arquivo (secao [build] abaixo), desde que voce
# aponte o config em:
#   Settings > Config-as-code > Railway Config File .. /api/railway.toml
#
# Se preferir configurar tudo pela interface, ignore este arquivo - os valores
# sao os mesmos.
#
# Como confirmar que pegou: no log de build deve aparecer
# "load build definition from Dockerfile" e as camadas de pip install - e NAO
# "Railpack could not determine how to build the app".
#
# ---------------------------------------------------------------------------
#   Volume ...........: mount path /data
#   Dominio publico ..: SIM - o painel roda na Vercel, que nao alcanca a rede
#                       privada da Railway (ADR 0010). Com a api exposta, o
#                       API_SERVICE_TOKEN e a UNICA tranca: 32 bytes url-safe.
#
# Variaveis (ver .env.example):
#   APP_ENV=railway                     OBRIGATORIO - sem isso o servico
#                                       recusa subir (evita gravar em disco
#                                       efemero e perder o banco no redeploy)
#   DB_PATH=/data/fase0a.sqlite3        CAMINHO ABSOLUTO
#   DATA_DIR=/data/datasets             CAMINHO ABSOLUTO
#   API_SERVICE_TOKEN=...               o mesmo valor configurado na Vercel
#   LLM_MAX_USD_ABSOLUTE=5.00           teto que a config do banco nao excede
#   CORS_ALLOWED_ORIGINS=               vazio: o painel faz proxy no servidor
#   ANTHROPIC_API_KEY / OPENAI_API_KEY  so a partir do incremento 5
#
#   PORT=8000                           precisa bater com o target port do
#                                       dominio gerado
#
# NAO defina HOST. O default e 0.0.0.0 (IPv4), que e o que o proxy publico da
# Railway usa. Definir HOST=:: quebra o acesso publico com
# "Application failed to respond" - "::" so serve para a rede privada.

[build]
builder = "DOCKERFILE"

# Caminho do Dockerfile, relativo a raiz do repositorio. E o que identifica
# qual servico este arquivo configura, sem depender de Root Directory.
dockerfilePath = "api/Dockerfile"

# Watch paths: padroes estilo gitignore, RELATIVOS A RAIZ DO REPOSITORIO
# (nao ao Root Directory). Decidem se um push dispara redeploy - nada a ver
# com iniciar o servico.
#
# Sao necessarios porque o repositorio `backend` abriga mais de um servico:
# sem isto, mexer em qualquer outro servico redeploya a `api`, e redeploy com
# volume derruba run em andamento.
watchPatterns = ["/api/**"]

[deploy]
# SEM `startCommand` de proposito.
#
# Com Dockerfile, o start command da Railway SOBRESCREVE o CMD da imagem - e
# o CMD aqui chama o start-backend.sh, que faz o pre-voo do volume e usa
# `exec` para o uvicorn virar PID 1 e receber SIGTERM no redeploy.
#
# Definir startCommand puliria o pre-voo e devolveria o problema de sinais.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
