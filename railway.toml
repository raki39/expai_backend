# Servico `api` da Fase 0A - Railway.
#
# Repositorio proprio: `backend/` (contem `api/`).
#
# A Railway constroi UM servico a partir do Dockerfile. Ela NAO orquestra
# docker-compose: o `backend/docker-compose.yml` existe apenas para rodar
# localmente. Quem ativa o servico aqui e este arquivo + api/Dockerfile.
#
# Este arquivo fica na RAIZ do repositorio de proposito: o arquivo de config
# da Railway nao segue o root directory, e a raiz e onde ela procura por
# padrao. Assim nao ha caminho de config para configurar - um passo a menos
# para esquecer.
#
# O Dockerfile, esse sim, e procurado dentro do root directory (/api).
#
# Configurar no painel da Railway:
#   Repositorio ......: backend
#   Root directory ...: /api    <- OBRIGATORIO. Sem isso a Railway analisa a
#                                  raiz do repo, nao acha Python nem Dockerfile,
#                                  e falha com "Railpack could not determine
#                                  how to build the app".
#   Watch paths ......: nao e necessario (repositorio dedicado)
#   Volume ...........: mount path /data
#   Dominio publico ..: SIM - o painel roda na Vercel, que nao alcanca a rede
#                       privada da Railway (ADR 0010). Com a api exposta, o
#                       API_SERVICE_TOKEN e a UNICA tranca: 32 bytes url-safe.
#
# Variaveis (ver api/.env.example):
#   APP_ENV=railway                     torna API_SERVICE_TOKEN obrigatorio
#   DB_PATH=/data/fase0a.sqlite3        CAMINHO ABSOLUTO
#   DATA_DIR=/data/datasets             CAMINHO ABSOLUTO
#   API_SERVICE_TOKEN=...               o mesmo valor configurado na Vercel
#   CORS_ALLOWED_ORIGINS=...            so se o navegador for chamar a api
#                                       direto; com o proxy do Next, deixe vazio
#   LLM_MAX_USD_ABSOLUTE=5.00           teto que a config do banco nao excede
#   ANTHROPIC_API_KEY / OPENAI_API_KEY  so a partir do incremento 5

[build]
builder = "DOCKERFILE"

[deploy]
# SEM `startCommand` de proposito.
#
# Com Dockerfile, o start command da Railway sobrescreve o ENTRYPOINT em forma
# EXEC - e ai `${PORT}` deixa de ser expandido, a menos que voce embrulhe tudo
# em shell. O `CMD` do Dockerfile ja esta em forma shell e resolve isso.
# Um lugar so, sem armadilha.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
