# Fase 0A - servico `api`, desenvolvimento LOCAL.
#
# Fica na raiz do repositorio: daqui ele orquestra QUALQUER servico do repo,
# apontando para o Dockerfile de cada um. Nao precisa estar na mesma pasta que
# o Dockerfile.
#
# A Railway NAO usa este arquivo - ela constroi um servico por vez, a partir
# do Dockerfile Path configurado. Compose nao e orquestrado pela Railway.
#
#   docker compose up --build      sobe a api em http://localhost:8000
#   docker compose logs -f api     log JSON estruturado
#   docker compose down            para, PRESERVANDO o volume
#   docker compose down -v         para e APAGA o banco
#
# Requer api/.env preenchido (copie de api/.env.example).

services:
  api:
    build:
      # Contexto = raiz do repositorio, igual ao build da Railway. Se local e
      # producao construissem diferente, um dos dois deixaria de ser testado.
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    environment:
      # Sobrepoe o .env: dentro do container os caminhos apontam para o volume.
      APP_ENV: local
      PORT: "8000"
      DB_PATH: /data/fase0a.sqlite3
      DATA_DIR: /data/datasets
    volumes:
      # Equivale ao volume da Railway montado em /data. E o que faz o banco
      # sobreviver a `docker compose down` e a rebuild da imagem.
      - dados_api:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ------------------------------------------------------------- coletor
  # Fase 0C, ADR 0028. Volume PROPRIO: o pre-voo recusa subir se COLETOR_DIR
  # colidir com o diretorio do banco do experimento.
  coletor:
    build:
      context: .
      dockerfile: coletor/Dockerfile
    environment:
      APP_ENV: local
      COLETOR_DIR: /dados
      COLETOR_SIMBOLO: btcusdt
    volumes:
      - dados_coletor:/dados
    restart: unless-stopped

  # ---------------------------------------------------------------- rele
  # Fase 0C, ADR 0029. SEM volume: ele nao guarda estado - o ponto de
  # retomada e perguntado a api a cada volta.
  #
  # Em producao ele roda em SINGAPURA, porque US East devolve HTTP 451 na
  # Binance (ADR 0028). Local nao tem essa restricao.
  rele:
    build:
      context: .
      dockerfile: rele/Dockerfile
    environment:
      RELE_API_URL: http://api:8000
      RELE_SIMBOLO: BTCUSDT
      RELE_TIMEFRAME: 15m
    env_file:
      - ./rele/.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dados_api:
  dados_coletor:
